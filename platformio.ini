; PlatformIO project config for the ESP32 DevKitV1 drone teleop bridge
;
;   pio run              compile
;   pio run -t upload    compile + flash
;   pio device monitor   serial monitor
;   pio run -t compiledb generate compile_commands.json for clangd
;
; Docs: https://docs.platformio.org/en/latest/platforms/espressif32.html

[env:esp32doit-devkit-v1]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino

; --- upload / monitor ---
; Leave upload_port unset and PlatformIO auto-detects the board. Uncomment
; and set it if you have multiple serial devices connected.
; upload_port = /dev/ttyUSB0
; monitor_port = /dev/ttyUSB0
upload_speed = 460800
monitor_speed = 115200

; DevKitV1 clones sometimes fail to auto-enter the bootloader. If uploads
; are flaky, drop the speed and/or hold BOOT while flashing begins.
; upload_speed = 460800

; --- build ---
build_flags =
    -Wall
    -Wextra

; Generate compile_commands.json on every build so clangd stays current.
; (Or run pio run -t compiledb on demand.)
build_type = debug
